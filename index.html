
<div id="login" class="login">
  <div class="card">
    <h1>Welcome to Fixora Hub</h1>
    <p class="muted">Your Repair History Passport starts here.</p>

    <!-- LOGIN -->
    <form id="loginForm">
      <h3>Login to Your Account</h3>

      <div class="field">
        <label for="email">Email Address</label>
        <input
          id="email"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >
      </div>

      <div class="actions">
        <button type="submit" style="width:100%">Login</button>
      </div>
    </form>

    <hr>

    <!-- REGISTER -->
    <form id="registerForm">
      <h3>Create a New Account</h3>

      <div class="field">
        <label for="regName">Full Name</label>
        <input
          id="regName"
          type="text"
          placeholder="Enter your full name"
          autocomplete="name"
          required
        >
      </div>

      <div class="field">
        <label for="regEmail">Email Address</label>
        <input
          id="regEmail"
          type="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >
      </div>

      <div class="field">
        <label for="regPassword">Password</label>
        <input
          id="regPassword"
          type="password"
          placeholder="Minimum 8 characters"
          minlength="8"
          autocomplete="new-password"
          required
        >
      </div>

      <div class="field">
        <label for="regRole">Account Type</label>
        <select id="regRole" required>
          <option value="customer">Customer</option>
          <option value="repair_shop_owner">Repair Shop Owner</option>
        </select>
      </div>

      <div class="actions">
        <button type="submit" style="width:100%">
          Create Account
        </button>
      </div>
    </form>

    <p id="authMessage" role="status" aria-live="polite"></p>
  </div>
</div>
