<div id="login" class="login">
  <div class="card">
    <h1>Welcome to RHP</h1>
    <p class="muted">Login or create your account.</p>

    <form id="loginForm">
      <h3>Login</h3>

      <div class="field">
        <label>Email</label>
        <input id="email" type="email" required>
      </div>

      <div class="field">
        <label>Password</label>
        <input id="password" type="password" required>
      </div>

      <div class="actions">
        <button type="submit" style="width:100%">Login</button>
      </div>
    </form>

    <hr>

    <form id="registerForm">
      <h3>Create Account</h3>

      <div class="field">
        <label>Full Name</label>
        <input id="regName" type="text" required>
      </div>

      <div class="field">
        <label>Email</label>
        <input id="regEmail" type="email" required>
      </div>

      <div class="field">
        <label>Password (minimum 8 characters)</label>
        <input id="regPassword" type="password" minlength="8" required>
      </div>

      <div class="field">
        <label>Account Type</label>
        <select id="regRole" required>
          <option value="customer">Customer</option>
          <option value="repair_shop_owner">Repair Shop Owner</option>
        </select>
      </div>

      <div class="actions">
        <button type="submit" style="width:100%">Create Account</button>
      </div>
    </form>

    <p id="authMessage"></p>
  </div>
</div>
